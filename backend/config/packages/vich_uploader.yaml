vich_uploader:
    db_driver: orm

    mappings:
        story_image:
            uri_prefix: /uploads/stories
            upload_destination: "%kernel.project_dir%/public/uploads/stories"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
